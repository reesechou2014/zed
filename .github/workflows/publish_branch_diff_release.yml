name: Publish Branch Diff Preview Release

on:
  push:
    branches:
      - feature/branch-diff-tree-view
    paths:
      - ".github/workflows/publish_branch_diff_release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish Windows x86_64 installer
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 29386052295 \
            --repo "${{ github.repository }}" \
            --name Zed-Branch-Diff-Preview-x86_64 \
            --dir dist

      - name: Verify installer checksum
        run: |
          echo "6decbb583c929c12cac18849ebceea206a7103f4d38be4e224d9b43f900195d7  dist/Zed-x86_64.exe" \
            | sha256sum --check --strict

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.11.2-branch-diff-tree.2 \
            dist/Zed-x86_64.exe#Zed-x86_64.exe \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --prerelease \
            --title "Zed Preview 1.11.2 - Branch Diff Tree View Fix 2" \
            --notes "Custom Zed Preview build based on v1.11.2-pre at commit 6e6b13aa6667114fa04d402f5a92cfd7fd590c29. Fixes Git: Branch Diff tree navigation for middle, split-view, and folded/deleted files, and adds a draggable tree width with double-click reset. Built as an unsigned Windows x86_64 installer by GitHub Actions. SHA-256: 6decbb583c929c12cac18849ebceea206a7103f4d38be4e224d9b43f900195d7"
